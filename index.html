<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jovel.app – Für ein sauberes Münster</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #2d3748;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 800;
      color: #38a169;
      letter-spacing: -1px;
      margin-bottom: 0.25rem;
    }

    .logo span {
      color: #2b6cb0;
    }

    .tagline {
      font-size: 1rem;
      color: #718096;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
    }

    .badge {
      display: inline-block;
      background: #ebf8ee;
      color: #276749;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 99px;
      margin-bottom: 1.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #1a202c;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #4a5568;
    }

    .divider {
      width: 48px;
      height: 4px;
      background: #38a169;
      border-radius: 2px;
      margin: 1.75rem auto;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✌️</div>
    <div class="logo">notfall<span>.ms</span></div>
    <div class="badge">Demnächst verfügbar</div>
    <h1>Wir bauen etwas Tolles</h1>
    <p>
      Hier entsteht bald <strong>notfall.ms</strong> – eine neue App
      für ein resilienteres Münster.
      Schau bald wieder vorbei!
    </p>
    <div class="divider"></div>
    <p>🌿 Gemeinsam für Münster.</p>
  </div>
  <footer>2026 Made with ❤️ by <a href="https://robert.berlin/">Robert Willemelis</a> · notfall.ms · Münster · </footer>
</body>
</html>
